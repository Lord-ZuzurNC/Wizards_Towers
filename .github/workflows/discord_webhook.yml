  uses: johnnyhuy/actions-discord-git-webhook@v1.0.0
  with:
    # Discord webhook URL
    webhook_url: https://discord.com/api/webhooks/1560767601343463525/cEAVme91_qRQStpYJyIvAQiexdRpod7UvH8BjxmK3SFXqHh5YlIxLvbwN6mNfwpFsEsS
    # Discord Webhook ID (ignored if `webhook_url` is set)
